name: Security Audit & E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run dependency scan
        run: pnpm audit --audit-level high
        
      - name: Run Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  e2e-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
        
      - name: Run Maestro Tests
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          # Typically you would build the app or download the APK/app artifact first
          # maestro test apps/mobile/.maestro/customer_flow.yaml
          # maestro test apps/mobile/.maestro/worker_flow.yaml
          echo "Maestro E2E ready for CI execution once build artifacts are available"
