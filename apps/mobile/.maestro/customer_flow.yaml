appId: com.fixli.app
---
- launchApp
- assertVisible: "How will you use Fixli?"
- tapOn: "I need a service"
- assertVisible: "Choose your country"
- tapOn: "Pakistan"
- tapOn: "Mobile number"
- inputText: "3001234567"
- tapOn: "Password"
- inputText: "TestPass123!"
- tapOn: "Sign In"
- assertVisible: "Hello,"
- tapOn: "Plumbing"
- assertVisible: "Describe what you need help with..."
- inputText: "My sink is leaking"
- tapOn: "Search"
- assertVisible: "Services"
- tapOn: "Leaky Pipe"
- tapOn: "Request"
- assertVisible: "Bookings"
- tapOn: "Profile"
- tapOn: "Log Out"
- assertVisible: "Sign In"
