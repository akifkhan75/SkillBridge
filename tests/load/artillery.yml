config:
  target: "http://localhost:3002"
  phases:
    - duration: 60
      arrivalRate: 5
      name: "Warm up"
    - duration: 120
      arrivalRate: 20
      name: "Sustained load"
  environments:
    production:
      target: "https://api.fixli.pk"
scenarios:
  - name: "Fetch configuration"
    flow:
      - get:
          url: "/api/config/countries"
  - name: "Health check"
    flow:
      - get:
          url: "/api/health"
