appId: pk.fixli.app
---
- launchApp:
    clearState: true
- assertVisible: "Sign In"
- tapOn: "Create Account"
- assertVisible: "How will you use Fixli?"
- tapOn: "I need a service"
- tapOn: "Full name"
- inputText: "Maestro Customer"
- tapOn: "Mobile number"
- inputText: "3001234567"
- tapOn: "Password"
- inputText: "password123"
- tapOn: "Create account"
- assertVisible: "Describe what you need help with..."
- tapOn: "AC Repair"
# In a real Maestro test, we would mock the backend or seed test data
- assertVisible: "Services"
